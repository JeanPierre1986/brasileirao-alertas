name: Brasileirão Predictor

on:
  schedule:
    # Todos los días a las 09:00 UTC (04:00 hora Ecuador aprox.)
    - cron: "0 9 * * *"
  workflow_dispatch: {}  # permite correrlo manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run predictor
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python predict.py

      - name: Commit updated predictions
        run: |
          git config user.name "brasileirao-bot"
          git config user.email "actions@github.com"
          git add data/predictions.json
          git diff --staged --quiet || git commit -m "Actualiza predicciones $(date -u +%Y-%m-%d)"
          git push
