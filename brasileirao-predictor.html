<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marcador — Brasileirão Predictor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg:#0B1F17; --bg-panel:#12291F; --turf:#1F6E43; --turf-light:#2E9760;
    --chalk:#F2F0E6; --chalk-dim:#9FB3A8; --floodlight:#F2C94C; --scarlet:#C0392B;
    --line:rgba(242,240,230,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; padding:24px 16px 60px;
    background: radial-gradient(ellipse at 50% -10%, rgba(46,151,96,0.18), transparent 60%), var(--bg);
    color:var(--chalk); font-family:'Inter',sans-serif;
  }
  .wrap{max-width:820px;margin:0 auto;}
  header{
    display:flex;align-items:baseline;justify-content:space-between;
    border-bottom:2px solid var(--turf);padding-bottom:14px;margin-bottom:20px;
    flex-wrap:wrap;gap:8px;
  }
  header h1{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;font-size:24px;margin:0;}
  header h1 span.sub{color:var(--chalk-dim);font-size:15px;font-weight:400;}
  .tag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:1.5px;}

  .status{text-align:center;padding:40px 0;color:var(--chalk-dim);font-family:'JetBrains Mono',monospace;font-size:13px;}
  .status.error{color:var(--scarlet);}

  .meta-bar{
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--chalk-dim);
    margin-bottom:18px;text-transform:uppercase;letter-spacing:0.5px;
  }
  button.refresh{
    font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;font-weight:600;
    font-size:12px;border:1px solid var(--line);border-radius:4px;padding:6px 14px;
    cursor:pointer;background:transparent;color:var(--chalk-dim);
  }
  button.refresh:hover{color:var(--chalk);border-color:var(--chalk-dim);}

  .card{
    background:var(--bg-panel);border:1px solid var(--line);border-radius:6px;
    padding:16px 18px;margin-bottom:14px;
  }
  .card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:6px;}
  .matchday{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--chalk-dim);text-transform:uppercase;}
  .matchdate{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--chalk-dim);}

  .teams-row{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;margin-bottom:14px;
  }
  .team-name{font-family:'Oswald',sans-serif;font-size:17px;text-transform:uppercase;}
  .team-name.home{text-align:right;}
  .team-name.away{text-align:left;}
  .score-digits{
    font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;color:var(--floodlight);
    background:#081611;border:1px solid var(--line);border-radius:6px;padding:4px 14px;letter-spacing:2px;
    white-space:nowrap;
  }

  .prob-bars{display:flex;flex-direction:column;gap:7px;}
  .prob-row{display:grid;grid-template-columns:80px 1fr 42px;align-items:center;gap:8px;}
  .prob-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--chalk-dim);text-transform:uppercase;}
  .prob-track{background:#0E241B;border-radius:3px;height:10px;overflow:hidden;border:1px solid var(--line);}
  .prob-fill{height:100%;background:var(--turf-light);}
  .prob-fill.home{background:var(--floodlight);}
  .prob-fill.away{background:var(--scarlet);}
  .prob-pct{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;text-align:right;}

  .xg-row{
    display:flex;justify-content:center;gap:32px;margin-top:10px;
    font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--chalk-dim);text-transform:uppercase;
  }
  .xg-row b{color:var(--chalk);font-size:13px;margin-left:4px;}

  @media (max-width:520px){
    .team-name{font-size:14px;}
    .score-digits{font-size:20px;padding:4px 10px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MARCADOR<span style="color:var(--floodlight);">.</span> <span class="sub">Brasileirão Predictor</span></h1>
    <span class="tag">Datos en vivo · GitHub</span>
  </header>

  <div id="content">
    <div class="status">Cargando predicciones…</div>
  </div>
</div>

<script>
const JSON_URL = "https://raw.githubusercontent.com/JeanPierre1986/brasileirao-alertas/main/data/predictions.json";

function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleString('es-EC', { weekday:'short', day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
}

async function load(){
  const content = document.getElementById('content');
  content.innerHTML = '<div class="status">Cargando predicciones…</div>';
  try{
    const res = await fetch(JSON_URL + '?t=' + Date.now()); // cache-bust
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    render(data);
  }catch(e){
    content.innerHTML = `<div class="status error">No se pudo cargar data/predictions.json.<br>${e.message}<br><br>Verifica que el repo sea público y que el workflow ya haya corrido al menos una vez.</div>`;
  }
}

function render(data){
  const content = document.getElementById('content');
  const matches = data.matches || [];

  let html = `<div class="meta-bar">
    <span>Actualizado: ${new Date(data.generatedAt).toLocaleString('es-EC')}</span>
    <span>Promedio de goles liga: ${data.leagueAvgGoals}</span>
  </div>`;

  if (matches.length === 0){
    html += '<div class="status">No hay partidos programados en los próximos días.</div>';
  }

  matches.forEach(m => {
    const p = m.prediction;
    html += `
      <div class="card">
        <div class="card-top">
          <span class="matchday">Jornada ${m.matchday ?? '—'}</span>
          <span class="matchdate">${fmtDate(m.utcDate)}</span>
        </div>
        <div class="teams-row">
          <div class="team-name home">${m.home}</div>
          <div class="score-digits">${p.likelyScore}</div>
          <div class="team-name away">${m.away}</div>
        </div>
        <div class="prob-bars">
          <div class="prob-row">
            <span class="prob-label">Local</span>
            <div class="prob-track"><div class="prob-fill home" style="width:${p.probHome}%"></div></div>
            <span class="prob-pct">${p.probHome}%</span>
          </div>
          <div class="prob-row">
            <span class="prob-label">Empate</span>
            <div class="prob-track"><div class="prob-fill" style="width:${p.probDraw}%"></div></div>
            <span class="prob-pct">${p.probDraw}%</span>
          </div>
          <div class="prob-row">
            <span class="prob-label">Visitante</span>
            <div class="prob-track"><div class="prob-fill away" style="width:${p.probAway}%"></div></div>
            <span class="prob-pct">${p.probAway}%</span>
          </div>
        </div>
        <div class="xg-row">
          <div>xG local<b>${p.xgHome}</b></div>
          <div>xG visitante<b>${p.xgAway}</b></div>
        </div>
      </div>
    `;
  });

  html += `<div style="text-align:center;margin-top:8px;"><button class="refresh" onclick="load()">↻ Recargar</button></div>`;
  content.innerHTML = html;
}

load();
</script>
</body>
</html>
